<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>和她说话的快捷键</title>
<style>
  :root { --bg: #ecebe7; --card: #f8f7f4; --fg: #2a2926; --muted: #6f6c66; --line: #d8d5ce; --accent: #4f6688; --err: #b4483f; --ok: #4d7a50; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1e21; --card: #26272b; --fg: #e8e6e1; --muted: #a29f98; --line: #3a3b40; --accent: #9db1d3; --err: #e07a70; --ok: #8dbd8e; color-scheme: dark; } }
  body { margin: 0; padding: 22px; background: var(--bg); color: var(--fg); font: 14px/1.6 system-ui, "Microsoft YaHei", "PingFang SC", sans-serif; }
  h1 { margin: 0 0 6px; font-size: 18px; }
  p { margin: 0 0 12px; color: var(--muted); }
  .keys { padding: 14px; border-radius: 8px; border: 1px dashed var(--line); background: var(--card); text-align: center; font-size: 20px;
          font-weight: 600; letter-spacing: .5px; outline: none; cursor: pointer; }
  .keys:focus { border: 2px solid var(--accent); padding: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button { padding: 7px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; cursor: pointer; }
  button.primary { border: none; background: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .status { min-height: 1.6em; margin: 10px 0 0; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
</style>
</head>
<body>
  <h1>和她说话的快捷键</h1>
  <p>在任何地方按它，她头顶会出来输入框。和别的软件（比如 QQ 截图的 Ctrl+Alt+A）撞了就换一个。</p>
  <div class="keys" id="keys" tabindex="0" role="textbox" aria-label="点这里，然后按下新的组合键">…</div>
  <p style="margin-top: 6px">点上面的框，按下想用的组合键（要带 Ctrl、Alt、Shift 里的至少一个，或者单独一个 F1～F12）。</p>
  <div class="row">
    <button class="primary" id="save" disabled>用这个</button>
    <button id="reset">恢复默认</button>
    <button id="none">不用快捷键</button>
  </div>
  <p class="status" id="status" role="status"></p>
<script>
  const $ = (id) => document.getElementById(id);
  let picked = null, fallback = "";
  // 浏览器的按键 → Electron 的加速键写法；显示时 Control 写成 Ctrl
  const NAMED = { Space: "Space", Enter: "Enter", Tab: "Tab", Backspace: "Backspace", Delete: "Delete", Insert: "Insert", Home: "Home", End: "End",
    PageUp: "PageUp", PageDown: "PageDown", ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right", Escape: "Escape",
    Backquote: "`", Minus: "-", Equal: "=", BracketLeft: "[", BracketRight: "]", Backslash: "\\", Semicolon: ";", Quote: "'", Comma: ",",
    Period: ".", Slash: "/" };
  const show = (accelerator) => (accelerator ? accelerator.replace(/Control/g, "Ctrl").replace(/Super/g, "Win") : "不用快捷键");
  function keyOf(event) {
    const code = event.code;
    if (/^Key[A-Z]$/.test(code)) return code.slice(3);
    if (/^Digit\d$/.test(code)) return code.slice(5);
    if (/^F([1-9]|1[0-9]|2[0-4])$/.test(code)) return code;
    if (/^Numpad\d$/.test(code)) return `num${code.slice(6)}`;
    return NAMED[code] || null;
  }
  function status(text, kind = "") { $("status").textContent = text; $("status").className = `status ${kind}`; }
  $("keys").addEventListener("keydown", (event) => {
    event.preventDefault();
    const key = keyOf(event);
    const mods = [event.ctrlKey && "Control", event.altKey && "Alt", event.shiftKey && "Shift", event.metaKey && "Super"].filter(Boolean);
    if (!key) { $("keys").textContent = mods.length ? `${show(mods.join("+"))}+…` : "…"; return; }
    if (!mods.length && !/^F\d+$/.test(key)) { status("要带 Ctrl、Alt、Shift 里的至少一个（单独的 F1～F12 也行）", "err"); return; }
    if (mods.length === 1 && mods[0] === "Shift" && !/^F\d+$/.test(key)) { status("只带 Shift 会挡住打字，再加个 Ctrl 或 Alt", "err"); return; }
    picked = [...mods, key].join("+");
    $("keys").textContent = show(picked);
    $("save").disabled = false;
    status("");
  });
  async function save(accelerator) {
    const result = await window.atriShortcut.save(accelerator);
    if (result.ok) {
      fallback = result.current;
      $("keys").textContent = show(result.current);
      $("save").disabled = true;
      picked = null;
      status(result.current ? `好了，现在按 ${show(result.current)} 和她说话。` : "好了，不用快捷键了（双击她也能说话）。", "ok");
    } else {
      status(result.message, "err");
    }
  }
  $("save").addEventListener("click", () => picked && save(picked));
  $("none").addEventListener("click", () => save(""));
  $("reset").addEventListener("click", async () => save((await window.atriShortcut.current()).default));
  window.atriShortcut.current().then(({ current }) => { fallback = current; $("keys").textContent = show(current); $("keys").focus(); });
  $("keys").addEventListener("blur", () => { if (!picked) $("keys").textContent = show(fallback); });
</script>
</body>
</html>
