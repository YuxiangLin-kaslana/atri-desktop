# 每次推送都在 Windows 机器上跑冒烟测试；推一个 v 开头的标签（和 package.json 里的版本一样，比如 v0.1.0），
# 测试过了就打安装包，发到这个仓库的 GitHub Release。装好的应用从这里检查更新（electron-updater 读 Release 里的 latest.yml）。
name: 测试和发布

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 冒烟测试（启动应用，走一遍登录、桌宠窗口、拖动、点透）
        run: npm test

  windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 版本号要和标签一致
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      # 只打包（会在 dist/ 生成安装包、blockmap 和自动更新要读的 latest.yml），上传交给 gh，一次传齐
      - name: 打包
        run: npx electron-builder --win --publish never
      - name: 发到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/ATRI-Setup-*.exe dist/ATRI-Setup-*.exe.blockmap dist/latest.yml \
            --title "ATRI ${GITHUB_REF_NAME}" \
            --notes "Windows 安装包：下载 ATRI-Setup-${GITHUB_REF_NAME#v}.exe，双击安装。第一次打开登录一次（默认连 https://atri.yuxianglin.xyz）；以后有新版本会自己更新。"
